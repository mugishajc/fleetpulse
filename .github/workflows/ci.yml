name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        service: [vehicles-api, alerts-worker, drivers-service, trips-service]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install helm and kubeconform
        run: |
          curl -sSLf https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz -C /usr/local/bin kubeconform
          curl -sSLf https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz | tar -xz --strip-components=1 -C /usr/local/bin linux-amd64/helm
      - name: Validate overlays
        run: |
          for env in staging production; do
            kubectl kustomize deploy/k8s/overlays/$env | kubeconform -strict -summary -ignore-missing-schemas
          done
      - name: Lint helm chart
        run: helm lint deploy/helm/fleetpulse
