apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts-worker
  labels: { app.kubernetes.io/name: alerts-worker, {{- include "fleetpulse.labels" . | nindent 4 }} }
spec:
  replicas: {{ .Values.alertsWorker.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: alerts-worker } }
  template:
    metadata: { labels: { app.kubernetes.io/name: alerts-worker } }
    spec:
      containers:
        - name: app
          image: "{{ .Values.alertsWorker.image.repository }}:{{ .Values.alertsWorker.image.tag }}"
          env:
            - { name: NATS_URL, value: nats://nats:4222 }
            - { name: METRICS_ADDR, value: ":9090" }
          ports: [{ containerPort: 9090, name: metrics }]
          resources: {{- toYaml .Values.alertsWorker.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /healthz, port: metrics } }
          livenessProbe:  { httpGet: { path: /healthz, port: metrics } }
