apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicles-api
  labels: { app.kubernetes.io/name: vehicles-api, {{- include "fleetpulse.labels" . | nindent 4 }} }
spec:
  replicas: {{ .Values.vehiclesApi.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: vehicles-api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: vehicles-api } }
    spec:
      containers:
        - name: app
          image: "{{ .Values.vehiclesApi.image.repository }}:{{ .Values.vehiclesApi.image.tag }}"
          env:
            - { name: NATS_URL, value: nats://nats:4222 }
            - { name: HTTP_ADDR, value: ":8080" }
          ports: [{ containerPort: 8080, name: http }]
          resources: {{- toYaml .Values.vehiclesApi.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          livenessProbe:  { httpGet: { path: /healthz, port: http } }
---
apiVersion: v1
kind: Service
metadata: { name: vehicles-api }
spec:
  selector: { app.kubernetes.io/name: vehicles-api }
  ports: [{ port: 8080, targetPort: http, name: http }]
