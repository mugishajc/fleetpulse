apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicles-api
  labels: { app.kubernetes.io/name: vehicles-api }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: vehicles-api } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vehicles-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/mugishajc/fleetpulse-vehicles-api:0.1.0
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: NATS_URL, value: nats://nats:4222 }
            - { name: HTTP_ADDR, value: ":8080" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
---
apiVersion: v1
kind: Service
metadata: { name: vehicles-api }
spec:
  selector: { app.kubernetes.io/name: vehicles-api }
  ports: [{ port: 8080, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: vehicles-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: vehicles-api }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
