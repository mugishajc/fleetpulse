apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts-worker
  labels: { app.kubernetes.io/name: alerts-worker }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: alerts-worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alerts-worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/mugishajc/fleetpulse-alerts-worker:0.1.0
          ports: [{ containerPort: 9090, name: metrics }]
          env:
            - { name: NATS_URL, value: nats://nats:4222 }
            - { name: METRICS_ADDR, value: ":9090" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
---
apiVersion: v1
kind: Service
metadata: { name: alerts-worker }
spec:
  selector: { app.kubernetes.io/name: alerts-worker }
  ports: [{ port: 9090, targetPort: metrics, name: metrics }]
