apiVersion: apps/v1
kind: Deployment
metadata:
  name: drivers-service
  labels: { app.kubernetes.io/name: drivers-service }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: drivers-service } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: drivers-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/mugishajc/fleetpulse-drivers-service:0.1.0
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: NATS_URL, value: nats://nats:4222 }
            - { name: HTTP_ADDR, value: ":8080" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          livenessProbe:  { httpGet: { path: /healthz, port: http } }
---
apiVersion: v1
kind: Service
metadata: { name: drivers-service }
spec:
  selector: { app.kubernetes.io/name: drivers-service }
  ports: [{ port: 8080, targetPort: http, name: http }]
